name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 单元测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 覆盖 Termux 可能带的版本范围。本项目只用标准库，所以低版本也能跑。
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查（全部模块与测试）
        run: python -m compileall -q trm tests run_tests.py

      - name: 跑单元测试
        run: python -m unittest discover -s tests -t . -v

      - name: 确认没有第三方依赖
        run: python scripts/check_no_deps.py trm

  shellcheck:
    name: shell 脚本检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 语法检查安装脚本与启动器
        run: |
          bash -n install.sh
          bash -n bootstrap.sh
          sh -n bin/trm
          echo "shell 语法检查通过"

      - name: 检查 bootstrap.sh 的 dry-run 与拒绝逻辑
        run: |
          # dry-run 必须在任何环境都能跑（只打印，不做改动）
          bash bootstrap.sh --dry-run | grep -q '将要执行的步骤'

          # 非 Termux 环境必须拒绝，不能硬着头皮往下装
          if PREFIX=/usr bash bootstrap.sh >/dev/null 2>&1; then
            echo "非 Termux 环境竟然没有拒绝，这是错的"
            exit 1
          fi

          # 危险参数必须在做任何动作之前就被拦下（脚本里会对该目录做 rm -rf）
          mkdir -p /tmp/fakebin
          printf '#!/bin/sh\nexit 0\n' > /tmp/fakebin/pkg
          chmod +x /tmp/fakebin/pkg
          if env -u PROOT_L2S_DIR -u container PATH=/tmp/fakebin:/usr/bin:/bin \
               PREFIX=/data/data/com.termux/files/usr TRM_REPO_DIR=/etc \
               bash bootstrap.sh >/dev/null 2>&1; then
            echo "TRM_REPO_DIR 不在 HOME 内竟然没有被拦下，这是危险的"
            exit 1
          fi
          echo "bootstrap 防护逻辑检查通过"

  webui:
    name: 面板前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查内联 JS 语法
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path("trm/webui/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert blocks, "index.html 里没有找到 <script> 块"
          pathlib.Path("webui_inline.js").write_text("\n".join(blocks), encoding="utf-8")
          print(f"提取到 {len(blocks)} 个 script 块")
          PY
          node --check webui_inline.js
          echo "面板 JS 语法检查通过"

      - name: 确认面板不引用任何外部资源
        run: |
          # 面板必须能离线加载：不允许 CDN、外链字体、外链图片。
          if grep -nE 'src="https?://|href="https?://' trm/webui/index.html; then
            echo "面板引用了外部资源，这会让离线/断网环境下打不开"
            exit 1
          fi
          echo "面板无外部依赖"
